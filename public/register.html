<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | SoundNest</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div id="brand-slot"></div>
      <div class="auth-header">
        <h1>Crea tu cuenta</h1>
        <p class="text-secondary">Arma tus playlists y guarda lo que escuchas.</p>
      </div>
      <div id="register-alert" class="alert" role="alert" hidden></div>
      <form id="register-form" class="form" novalidate>
        <div class="form-field">
          <label class="form-label" for="name">Nombre</label>
          <input class="form-input" id="name" name="name" type="text" autocomplete="name" placeholder="Tu nombre" required>
          <span class="field-error" data-error-for="name"></span>
        </div>
        <div class="form-field">
          <label class="form-label" for="email">Correo electrónico</label>
          <input class="form-input" id="email" name="email" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
          <span class="field-error" data-error-for="email"></span>
        </div>
        <div class="form-field">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-input" id="password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required>
          <span class="field-error" data-error-for="password"></span>
        </div>
        <div class="form-field">
          <label class="form-label" for="passwordConfirmation">Confirmar contraseña</label>
          <input class="form-input" id="passwordConfirmation" name="passwordConfirmation" type="password" autocomplete="new-password" placeholder="Repite la contraseña" required>
          <span class="field-error" data-error-for="passwordConfirmation"></span>
        </div>
        <div class="form-field">
          <label class="form-checkbox">
            <input id="acceptTerms" name="acceptTerms" type="checkbox">
            Acepto los términos y la política de privacidad
          </label>
          <span class="field-error" data-error-for="acceptTerms"></span>
        </div>
        <button class="button button-primary button-block" type="submit">Crear cuenta</button>
      </form>
      <p class="auth-footer text-secondary">¿Ya tienes cuenta? <a class="link-brand" href="/index.html">Inicia sesión</a></p>
    </section>
  </main>
  <script type="module" src="/js/pages/register.js"></script>
</body>
</html>
