<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | SoundNest</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div id="brand-slot"></div>
      <div class="auth-header">
        <h1>Bienvenido de nuevo</h1>
        <p class="text-secondary">Inicia sesión para seguir escuchando tu música.</p>
      </div>
      <div id="login-alert" class="alert" role="alert" hidden></div>
      <form id="login-form" class="form" novalidate>
        <div class="form-field">
          <label class="form-label" for="email">Correo electrónico</label>
          <input class="form-input" id="email" name="email" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
          <span class="field-error" data-error-for="email"></span>
        </div>
        <div class="form-field">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>
          <span class="field-error" data-error-for="password"></span>
        </div>
        <button class="button button-primary button-block" type="submit">Iniciar sesión</button>
      </form>
      <p class="auth-footer text-secondary">¿No tienes cuenta? <a class="link-brand" href="/register.html">Crear cuenta</a></p>
    </section>
  </main>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
